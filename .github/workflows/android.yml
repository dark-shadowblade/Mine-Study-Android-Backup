name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable app signing key
        run: |
          mkdir -p "$HOME/.android"
          cp app/debug.keystore "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-study-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mine Study v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
