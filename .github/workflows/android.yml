name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: mine-study-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable app signing key
        run: |
          mkdir -p "$HOME/.android"
          cp app/debug.keystore "$HOME/.android/debug.keystore"
      - name: Inspect stable signing key
        run: |
          set -euo pipefail
          echo "=== Repository keystore ==="
          keytool -list -v -keystore app/debug.keystore -storepass android
          echo "=== Android debug keystore ==="
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android
          echo "=== Earlier repository keystore candidate ==="
          git fetch --no-tags origin bf7a061782301ef07816ef256f865c10c1dac004
          git show bf7a061782301ef07816ef256f865c10c1dac004:app/debug.keystore > /tmp/earlier-debug.keystore
          keytool -list -v -keystore /tmp/earlier-debug.keystore -storepass android
      - name: Build debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }}
      - name: Compare APK signing certificates with v1.0.43
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          curl -L --fail --silent --show-error \
            https://github.com/dark-shadowblade/Mine-Study-Android-Backup/releases/download/v1.0.43/app-debug.apk \
            -o /tmp/mine-study-v1.0.43.apk
          echo "=== Installed baseline v1.0.43 ==="
          "$APKSIGNER" verify --print-certs /tmp/mine-study-v1.0.43.apk
          echo "=== Newly built APK ==="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          OLD_CERT="$("$APKSIGNER" verify --print-certs /tmp/mine-study-v1.0.43.apk | grep 'Signer #1 certificate SHA-256 digest' | head -n 1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest' | head -n 1)"
          echo "Baseline: $OLD_CERT"
          echo "Current:  $NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "::error::APK signing certificate differs from v1.0.43"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-study-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mine Study v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
